display_information:
  name: <your Slack app name>
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: <your Slack app name>
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - reactions:write
      - reactions:read
      - channels:read
      - channels:history
      - channels:join
      - groups:read
      - groups:history
      - im:read
      - im:history
      - mpim:read
      - mpim:history
      - users:read
      - team:read
      - search:read.public
      - search:read.users
      - users:read.email
      # coworker profile only; drop these for the guarded 7-tool profile
      - channels:manage
      - groups:write
      - im:write
      - mpim:write
      - files:read
      - files:write
      - pins:read
      - pins:write
      - bookmarks:read
      - bookmarks:write
      - usergroups:read
      - dnd:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - channel_created
      - channel_rename
      - member_joined_channel
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
